# Render Blueprint: one free web service that serves the game and the multiplayer WebSocket (/ws).
services:
  - type: web
    name: elf-and-crab
    runtime: node
    plan: free
    # Dev dependencies (vite, typescript, esbuild) are needed to build.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
